<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tantangan #03: Toggle Mode Malam</title>
    <style>
        /* Tema Terang (Default) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 100px;
            transition: background-color 0.5s, color 0.5s;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Tema Gelap */
        body.dark-mode {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #007bff;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1 id="judul">Selamat Datang di Mode Terang</h1>
    <p>Klik tombol di bawah untuk mengubah suasana.</p>
    
    <button id="btn-toggle">🌙 Aktifkan Dark Mode</button>

    <script src="script.js"></script>
</body>
</html>
